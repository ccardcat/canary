[package]
name = "scaffold"
version = "0.1.0"
edition = "2021"
[lib]
name = "scaffold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
zip = "2"
sha2 = "0.10"
dirs = "6"
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
