[package]
name = "scaffold"
default-run = "scaffold"
version = "0.1.8"
edition = "2021"
[lib]
name = "scaffold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-rich-presence = "=1.1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
zip = "2"
sha2 = "0.10"
sha1 = "0.10"
dirs = "6"
dunce = "1"
tokio = { version = "1", features = ["process", "fs", "io-util", "time", "sync", "rt-multi-thread", "net", "macros"] }
uuid = { version = "1", features = ["v4"] }
keyring = "3"
shlex = "1"
regex = "1"
tauri-plugin-dialog = "2"
zeroize = "1"
base64 = "0.23"
fs2 = "0.4"
image = {version="0.25",default-features=false,features= ["png", "jpeg", "webp"] }
flate2 = "1"
tar = "0.4"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
backend-check = []
native-qa = ["tauri/devtools"]

[[bin]]
name = "canary-backend-check"
path = "src/backend_check.rs"
required-features = ["backend-check"]

[target.'cfg(windows)'.dependencies]
keyring = {version="3",features= ["windows-native"] }
window-vibrancy = "=0.8.1"
[target.'cfg(target_os="linux")'.dependencies]
keyring = {version="3",features= ["sync-secret-service", "crypto-rust"] }
