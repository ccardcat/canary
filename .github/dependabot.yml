version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /services/curseforge-gateway
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns: ["*"]
