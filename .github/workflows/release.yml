name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.0
        type: string
      platform:
        description: Platforms to build
        required: true
        default: windows
        type: choice
        options: [windows, windows-and-linux]
      reuse_run:
        description: Optional successful build run ID (retry publication without rebuilding)
        required: false
        default: ''
        type: string

env:
  CANARY_CURSEFORGE_PROXY_URL: ${{ vars.CANARY_CURSEFORGE_PROXY_URL }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  WINDOWS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' }}

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-release.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload release browser QA
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-release-browser-qa
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            .qa/
          if-no-files-found: warn

  record-start:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Record started build
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          receipt = {'tag': os.environ['RELEASE_TAG'], 'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'status': 'building', 'windows_only': os.environ['WINDOWS_ONLY'] == 'true',
                     'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          with open('release-status.json', 'w') as f:
              json.dump(receipt, f, indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code origin refs/notes/releases; then
            git fetch origin refs/notes/releases:refs/notes/releases
          fi
          git notes --ref=releases add -f -F release-status.json HEAD
          git push origin refs/notes/releases

  build:
    if: inputs.reuse_run == ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && '[{"os":"windows-latest","bundles":"nsis,msi","platform":"windows-x64"}]' || '[{"os":"ubuntu-22.04","bundles":"deb,appimage","platform":"linux-x64"},{"os":"windows-latest","bundles":"nsis,msi","platform":"windows-x64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - run: npm ci
      - run: node scripts/check-release.mjs
      - name: Check release version
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); const t=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")); if (`v${p.version}` !== process.env.RELEASE_TAG || p.version !== t.version) throw Error("Release tag must match application version");'
      - name: Rust regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installers
        id: installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri build -- --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Build Windows inspector executable for native QA
        if: runner.os == 'Windows'
        run: node .github/scripts/build-window-qa.mjs
      - name: Prepare Windows WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-webview2.ps1 *>&1 | Tee-Object -FilePath webview2-runtime.log
      - name: Windows native window and material QA
        if: runner.os == 'Windows'
        run: node .github/scripts/window-smoke.mjs qa/windows-window-smoke/canary-native-qa.exe
      - name: Upload Windows visual QA
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-release-windows-window-qa
          path: qa/windows-window-smoke/
          if-no-files-found: warn
      - name: Record tagged build provenance
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, subprocess
          from pathlib import Path
          files=[p for p in Path('src-tauri/target/release/bundle').rglob('*') if p.is_file() and p.suffix in ('.exe','.msi','.deb','.AppImage')]
          assert files, 'No installers for provenance'
          value={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tag':os.environ['RELEASE_TAG'],'platform':os.environ['RELEASE_PLATFORM'],'run_id':os.environ['GITHUB_RUN_ID'],'workflow_sha':os.environ['WORKFLOW_SOURCE_SHA'],'files':[{'name':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]}
          Path('provenance.json').write_text(json.dumps(value,indent=2))
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-release-provenance-${{ matrix.platform }}
          path: provenance.json
          if-no-files-found: error
      - name: Upload installers
        if: always() && steps.installers.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  publish:
    needs: [build, record-start, frontend]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Checkout trusted release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-policy
      - name: Verify installer provenance
        if: needs.frontend.result == 'success' && (needs.build.result == 'success' || inputs.reuse_run != '')
        env:
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: node release-policy/.github/scripts/verify-release-source.mjs
      - name: Download source receipts
        if: needs.frontend.result == 'success' && (needs.build.result == 'success' || inputs.reuse_run != '')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: canary-release-provenance-*
          path: ${{ runner.temp }}/canary-release-provenance
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run || github.run_id }}
      - name: Verify tagged source receipts
        if: needs.frontend.result == 'success' && (needs.build.result == 'success' || inputs.reuse_run != '')
        env:
          REUSE_RUN: ${{ inputs.reuse_run }}
          CANARY_RELEASE_PROVENANCE: ${{ runner.temp }}/canary-release-provenance
        run: node release-policy/.github/scripts/verify-release-source.mjs --receipts
      - name: Download installers
        if: needs.frontend.result == 'success' && (needs.build.result == 'success' || inputs.reuse_run != '')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.WINDOWS_ONLY == 'true' && 'canary-windows-x64' || 'canary-*-x64' }}
          path: ${{ runner.temp }}/canary-installers
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run || github.run_id }}
      - name: Verify downloaded installer bytes
        if: needs.frontend.result == 'success' && (needs.build.result == 'success' || inputs.reuse_run != '')
        env:
          REUSE_RUN: ${{ inputs.reuse_run }}
          CANARY_RELEASE_PROVENANCE: ${{ runner.temp }}/canary-release-provenance
          CANARY_INSTALLERS: ${{ runner.temp }}/canary-installers
        run: node release-policy/.github/scripts/verify-release-source.mjs --files
      - name: Publish complete release
        id: publish
        if: needs.frontend.result == 'success' && (needs.build.result == 'success' || inputs.reuse_run != '')
        shell: bash
        run: |
          exec > >(tee publication.log) 2>&1
          export CANARY_RELEASE_ASSETS="$(mktemp -d "$RUNNER_TEMP/canary-release.XXXXXX")"
          find "$RUNNER_TEMP/canary-installers" -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) -exec cp {} "$CANARY_RELEASE_ASSETS/" \;
          python3 - <<'PY'
          import os
          from pathlib import Path
          names = [p.name for p in Path(os.environ['CANARY_RELEASE_ASSETS']).iterdir()]
          windows_only = os.environ['WINDOWS_ONLY'] == 'true'
          required = ('.exe', '.msi') if windows_only else ('.deb', '.AppImage', '.exe', '.msi')
          for suffix in required:
              assert any(n.endswith(suffix) for n in names), f'Missing installer: {suffix}'
          notes = Path('docs/RELEASE.md').read_text()
          if windows_only:
              notes = '\n'.join(line for line in notes.splitlines() if not line.startswith('- **Linux:**'))
              notes = notes.replace('for Windows x64 and Linux x64.', 'for Windows x64.')
          Path('release-notes.md').write_text(notes)
          PY
          (cd "$CANARY_RELEASE_ASSETS" && sha256sum * > SHA256SUMS)
          gh release create "$RELEASE_TAG" "$CANARY_RELEASE_ASSETS"/* --draft --verify-tag --title "Canary $RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false
          gh release edit "$RELEASE_TAG" --latest
      - name: Record publication result
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          status = 'published' if os.environ['PUBLISH_RESULT'] == 'success' else 'failed'
          receipt = {'tag': os.environ['RELEASE_TAG'], 'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'status': status,
                     'build': os.environ['BUILD_RESULT'], 'publish': os.environ['PUBLISH_RESULT'],
                     'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          if status == 'published':
              release = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{os.environ['RELEASE_TAG']}"]))
              receipt['release_url'] = release['html_url']
              receipt['assets'] = [{'name': a['name'], 'size': a['size'], 'url': a['browser_download_url'], 'digest': a.get('digest')} for a in release['assets']]
          else:
              if Path('publication.log').exists():
                  receipt['publication_log'] = Path('publication.log').read_text(errors='replace')[-24000:]
              try:
                  root = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
                  jobs = json.loads(subprocess.check_output(['gh', 'api', root + '/jobs']))['jobs']
                  receipt['jobs'] = [{'name': j['name'], 'conclusion': j['conclusion'], 'url': j['html_url']} for j in jobs]
                  logs = []
                  for job in jobs:
                      if job['conclusion'] == 'failure':
                          logs.append(subprocess.check_output(['gh', 'api', '--allow-escape-sequences', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/jobs/{job['id']}/logs"], text=True)[-20000:])
                  receipt['failure_log'] = '\n'.join(logs)
              except subprocess.CalledProcessError as e:
                  receipt['failure_log'] = str(e)
          with open('release-status.json', 'w') as f:
              json.dump(receipt, f, indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code origin refs/notes/releases; then
            git fetch origin refs/notes/releases:refs/notes/releases
          fi
          git notes --ref=releases add -f -F release-status.json HEAD
          git push origin refs/notes/releases
          test "$PUBLISH_RESULT" = success

