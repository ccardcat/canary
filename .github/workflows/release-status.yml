name: Release status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-status.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Desktop release']
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: release-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record release and job status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = f"repos/{os.environ['GITHUB_REPOSITORY']}"
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', root + path], text=True))
          tag = 'v' + json.loads(Path('package.json').read_text())['version']
          runs = api('/actions/workflows/release.yml/runs?per_page=30')['workflow_runs']
          commit = subprocess.check_output(['git', 'rev-parse', tag + '^{commit}'], text=True).strip()
          matching = [r for r in runs if r['head_sha'] == commit]
          receipt = {'tag': tag, 'commit': commit}
          if matching:
              run = matching[0]
              receipt.update(run_url=run['html_url'], status=run['status'], conclusion=run['conclusion'])
              jobs = api(f"/actions/runs/{run['id']}/jobs")['jobs']
              receipt['jobs'] = [{'name': j['name'], 'status': j['status'], 'conclusion': j['conclusion'],
                  'steps': [{'name': s['name'], 'status': s['status'], 'conclusion': s['conclusion']} for s in j['steps']]} for j in jobs]
              for job in jobs:
                  if job['conclusion'] == 'failure':
                      try:
                          receipt.setdefault('failure_logs', {})[job['name']] = subprocess.check_output(
                              ['gh', 'api', root + f"/actions/jobs/{job['id']}/logs"], text=True)[-24000:]
                      except subprocess.CalledProcessError:
                          receipt.setdefault('logs_unavailable', []).append(job['name'])
          else:
              receipt['status'] = 'no_matching_run'
          try:
              release = api('/releases/tags/' + tag)
              receipt['release'] = {'url': release['html_url'], 'draft': release['draft'], 'prerelease': release['prerelease'],
                  'assets': [{'name': a['name'], 'size': a['size'], 'url': a['browser_download_url'], 'digest': a.get('digest')} for a in release['assets']]}
          except subprocess.CalledProcessError:
              receipt['release_unavailable'] = True
          Path('release-diagnostics.json').write_text(json.dumps(receipt, indent=2))
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          note = 'refs/notes/release-diagnostics'
          if subprocess.run(['git', 'ls-remote', '--exit-code', 'origin', note]).returncode == 0:
              subprocess.run(['git', 'fetch', 'origin', note + ':' + note], check=True)
          subprocess.run(['git', 'notes', '--ref=release-diagnostics', 'add', '-f', '-F', 'release-diagnostics.json', commit], check=True)
          subprocess.run(['git', 'push', 'origin', note], check=True)
          PY
