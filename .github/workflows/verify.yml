name: Desktop verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-verification-${{ github.sha }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
          - os: ubuntu-22.04
            platform: linux
            bundles: deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Record started verification
        shell: bash
        env:
          VERIFY_PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          receipt = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'status': 'running', 'platform': os.environ['VERIFY_PLATFORM'],
                     'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          try:
              root = f"repos/{os.environ['GITHUB_REPOSITORY']}"
              runs = json.loads(subprocess.check_output(['gh', 'api', root + '/actions/workflows/verify.yml/runs?per_page=4'], text=True))['workflow_runs']
              for run in runs:
                  if run['id'] == int(os.environ['GITHUB_RUN_ID']): continue
                  jobs = json.loads(subprocess.check_output(['gh', 'api', root + f"/actions/runs/{run['id']}/jobs"], text=True))['jobs']
                  receipt.setdefault('recent_jobs', []).extend(
                      {'run_url': run['html_url'], 'job': j['name'], 'status': j['status'], 'conclusion': j['conclusion'],
                       'steps': [{'name': s['name'], 'status': s['status'], 'conclusion': s['conclusion']} for s in j['steps']]}
                      for j in jobs if os.environ['VERIFY_PLATFORM'] in j['name'])
                  failed = next((j for j in jobs if j['conclusion'] == 'failure' and os.environ['VERIFY_PLATFORM'] in j['name']), None)
                  if failed:
                      receipt['previous_failure'] = {'run_url': run['html_url'], 'steps': [s['name'] for s in failed['steps'] if s['conclusion'] == 'failure']}
                      receipt['previous_failure']['log'] = subprocess.check_output(['gh', 'api', root + f"/actions/jobs/{failed['id']}/logs"], text=True)[-24000:]
                      break
          except (subprocess.CalledProcessError, KeyError) as error:
              receipt['previous_log_unavailable'] = str(error)
          with open('desktop-verification.json', 'w') as output: json.dump(receipt, output, indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          note="refs/notes/qa-${VERIFY_PLATFORM}"
          if git ls-remote --exit-code origin "$note"; then git fetch origin "$note:$note"; fi
          git notes --ref="qa-${VERIFY_PLATFORM}" add -f -F desktop-verification.json HEAD
          git push origin "$note"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - shell: bash
        run: set -o pipefail; npm ci 2>&1 | tee npm-ci.log
      - shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee frontend-build.log
      - shell: bash
        run: set -o pipefail; cargo check --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-check.log
      - shell: bash
        run: set -o pipefail; cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-test.log
      - name: Build desktop installers
        id: installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        shell: bash
        run: set -o pipefail; npm run tauri build -- --ci --bundles ${{ matrix.bundles }} -- --locked 2>&1 | tee desktop-build.log
      - name: Build Windows inspector executable for native QA
        if: runner.os == 'Windows'
        run: node .github/scripts/build-window-qa.mjs
      - name: Prepare Windows WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-webview2.ps1 *>&1 | Tee-Object -FilePath webview2-runtime.log
      - name: Windows native window and material QA
        if: runner.os == 'Windows'
        shell: bash
        run: set -o pipefail; node .github/scripts/window-smoke.mjs qa/windows-window-smoke/canary-native-qa.exe 2>&1 | tee windows-window-smoke.log
      - name: Upload Windows visual QA
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-windows-window-qa
          path: qa/windows-window-smoke/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && steps.installers.outcome == 'success'
        with:
          name: canary-built-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
      - name: Record verification result
        if: always()
        shell: bash
        env:
          VERIFY_STATUS: ${{ job.status }}
          VERIFY_PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          receipt = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'status': os.environ['VERIFY_STATUS'], 'platform': os.environ['VERIFY_PLATFORM'],
                     'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          if receipt['status'] != 'success':
              receipt['step_logs'] = {p: Path(p).read_text(errors='replace')[-12000:] for p in ['npm-ci.log', 'frontend-build.log', 'cargo-check.log', 'cargo-test.log', 'desktop-build.log', 'webview2-runtime.log', 'windows-window-smoke.log'] if Path(p).exists()}
              try:
                  endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs"
                  jobs = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))['jobs']
                  failed = [j for j in jobs if j['conclusion'] == 'failure' and os.environ['VERIFY_PLATFORM'] in j['name']]
                  receipt['failed_steps'] = [{'job': j['name'], 'steps': [s['name'] for s in j['steps'] if s['conclusion'] == 'failure']} for j in failed]
                  receipt['failure_log'] = '\n'.join(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/jobs/{j['id']}/logs"], text=True)[-24000:] for j in failed)
              except (subprocess.CalledProcessError, KeyError) as error:
                  receipt['log_unavailable'] = str(error)
          if Path('qa/windows-window-smoke/result.json').exists(): receipt['window_qa'] = json.loads(Path('qa/windows-window-smoke/result.json').read_text())
          with open('desktop-verification.json', 'w') as output:
              json.dump(receipt, output, indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          note="refs/notes/qa-${VERIFY_PLATFORM}"
          if git ls-remote --exit-code origin "$note"; then
            git fetch origin "$note:$note"
          fi
          git notes --ref="qa-${VERIFY_PLATFORM}" add -f -F desktop-verification.json HEAD
          git push origin "$note"
  report-failure:
    needs: desktop
    if: failure()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Record completed job failure logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          root = f"repos/{os.environ['GITHUB_REPOSITORY']}"
          jobs = json.loads(subprocess.check_output(['gh', 'api', root + f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs"], text=True))['jobs']
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          for job in jobs:
              if job['conclusion'] != 'failure' or not job['name'].startswith('desktop'): continue
              platform = 'windows' if 'windows' in job['name'] else 'linux'
              receipt = {'commit': os.environ['GITHUB_SHA'], 'platform': platform, 'status': 'failure',
                         'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                         'failed_steps': [s['name'] for s in job['steps'] if s['conclusion'] == 'failure'],
                         'failure_log': subprocess.check_output(['gh', 'api', root + f"/actions/jobs/{job['id']}/logs"], text=True)[-30000:]}
              note = f'refs/notes/qa-{platform}'
              if subprocess.run(['git', 'ls-remote', '--exit-code', 'origin', note]).returncode == 0:
                  subprocess.run(['git', 'fetch', 'origin', f'{note}:{note}'], check=True)
                  saved = subprocess.run(['git', 'notes', f'--ref=qa-{platform}', 'show', 'HEAD'], capture_output=True, text=True)
                  if saved.returncode == 0:
                      previous = json.loads(saved.stdout)
                      previous.update(receipt)
                      receipt = previous
              with open('desktop-failure.json', 'w') as output: json.dump(receipt, output, indent=2)
              subprocess.run(['git', 'notes', f'--ref=qa-{platform}', 'add', '-f', '-F', 'desktop-failure.json', 'HEAD'], check=True)
              subprocess.run(['git', 'push', 'origin', note], check=True)
          PY
