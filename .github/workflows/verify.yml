name: Desktop verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-verification-${{ github.sha }}
  cancel-in-progress: false
env:
  CANARY_CURSEFORGE_PROXY_URL: ${{ vars.CANARY_CURSEFORGE_PROXY_URL }}
jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: node scripts/check-release.mjs
      - run: npm run build
      - run: node --test .github/scripts/verify-release-source.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload browser QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-browser-qa
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            .qa/
          if-no-files-found: warn
  rust-advisories:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Install audited scanner version
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Scan locked Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
  curseforge-gateway:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: services/curseforge-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/curseforge-gateway/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npx wrangler deploy --dry-run
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
          - os: ubuntu-22.04
            platform: linux
            bundles: deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - shell: bash
        run: set -o pipefail; npm ci 2>&1 | tee npm-ci.log
      - shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee frontend-build.log
      - shell: bash
        run: set -o pipefail; cargo check --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-check.log
      - shell: bash
        run: set -o pipefail; cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-test.log
      - name: Release provenance regression tests
        run: node --test .github/scripts/verify-release-source.test.mjs
      - name: Controlled real Modrinth installation regression
        if: runner.os == 'Linux'
        shell: bash
        run: set -o pipefail; cargo test --locked --manifest-path src-tauri/Cargo.toml installer::tests::real_modrinth_install -- --ignored 2>&1 | tee modrinth-install.log
      - name: Build desktop installers
        id: installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        shell: bash
        run: set -o pipefail; npm run tauri build -- --ci --bundles ${{ matrix.bundles }} -- --locked 2>&1 | tee desktop-build.log
      - name: Build Windows inspector executable for native QA
        if: runner.os == 'Windows'
        run: node .github/scripts/build-window-qa.mjs
      - name: Prepare Windows WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-webview2.ps1 *>&1 | Tee-Object -FilePath webview2-runtime.log
      - name: Windows packaged CSP security and compatibility QA
        if: runner.os == 'Windows'
        env:
          CANARY_CSP_QA_OUTPUT: qa/windows-csp-smoke
          CANARY_CSP_QA_PORT: '9384'
        shell: bash
        run: set -o pipefail; node .github/scripts/csp-smoke.mjs qa/windows-window-smoke/canary-native-qa.exe 2>&1 | tee windows-csp-smoke.log
      - name: Upload Windows CSP QA
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-windows-csp-qa
          path: |
            qa/windows-csp-smoke/result.json
            qa/windows-csp-smoke/native-csp.png
            qa/windows-csp-smoke/startup.log
            windows-csp-smoke.log
          if-no-files-found: warn
      - name: Windows native window and material QA
        if: runner.os == 'Windows'
        shell: bash
        run: set -o pipefail; node .github/scripts/window-smoke.mjs qa/windows-window-smoke/canary-native-qa.exe 2>&1 | tee windows-window-smoke.log
      - name: Upload Windows visual QA
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-windows-window-qa
          path: qa/windows-window-smoke/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.installers.outcome == 'success'
        with:
          name: canary-built-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
      - name: Record verification result
        if: always()
        shell: bash
        env:
          VERIFY_STATUS: ${{ job.status }}
          VERIFY_PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          receipt = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'status': os.environ['VERIFY_STATUS'], 'platform': os.environ['VERIFY_PLATFORM'],
                     'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          if receipt['status'] != 'success':
              receipt['step_logs'] = {p: Path(p).read_text(errors='replace')[-12000:] for p in ['npm-ci.log', 'frontend-build.log', 'cargo-check.log', 'cargo-test.log', 'desktop-build.log', 'webview2-runtime.log', 'windows-window-smoke.log'] if Path(p).exists()}
              try:
                  endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs"
                  jobs = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))['jobs']
                  failed = [j for j in jobs if j['conclusion'] == 'failure' and os.environ['VERIFY_PLATFORM'] in j['name']]
                  receipt['failed_steps'] = [{'job': j['name'], 'steps': [s['name'] for s in j['steps'] if s['conclusion'] == 'failure']} for j in failed]
                  receipt['failure_log'] = '\n'.join(subprocess.check_output(['gh', 'api', '--allow-escape-sequences', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/jobs/{j['id']}/logs"], text=True)[-24000:] for j in failed)
              except (subprocess.CalledProcessError, KeyError) as error:
                  receipt['log_unavailable'] = str(error)
          if Path('qa/windows-csp-smoke/result.json').exists(): receipt['csp_qa'] = json.loads(Path('qa/windows-csp-smoke/result.json').read_text())
          if Path('qa/windows-window-smoke/result.json').exists(): receipt['window_qa'] = json.loads(Path('qa/windows-window-smoke/result.json').read_text())
          with open('desktop-verification.json', 'w') as output:
              json.dump(receipt, output, indent=2)
          PY
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-verification-${{ matrix.platform }}-receipt
          path: desktop-verification.json
          if-no-files-found: error
  publish-verification:
    needs: desktop
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: canary-verification-*-receipt
          path: verification-receipts
      - name: Publish verified receipts as Git notes
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          for path in Path('verification-receipts').glob('*/desktop-verification.json'):
              value=json.loads(path.read_text())
              assert value['commit']==os.environ['GITHUB_SHA']
              assert value['platform'] in ('windows','linux')
              platform=value['platform']; note=f'refs/notes/qa-{platform}'
              if subprocess.run(['git','ls-remote','--exit-code','origin',note]).returncode==0:
                  subprocess.run(['git','fetch','origin',f'{note}:{note}'],check=True)
              subprocess.run(['git','notes',f'--ref=qa-{platform}','add','-f','-F',str(path),'HEAD'],check=True)
              subprocess.run(['git','push','origin',note],check=True)
          PYTHON
