name: Desktop verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
          - os: ubuntu-22.04
            platform: linux
            bundles: deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri build -- --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Windows executable smoke check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\src-tauri\target\release\scaffold.exe' -PassThru
          try {
            Start-Sleep -Seconds 12
            $process.Refresh()
            if ($process.HasExited) { throw "Canary exited during native startup (code $($process.ExitCode))" }
            if ($process.MainWindowHandle -eq 0) { throw 'Canary did not create a native window' }
            Write-Output 'WINDOWS_NATIVE_WINDOW_VERIFIED'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: canary-verified-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
      - name: Record verification result
        if: always()
        shell: bash
        env:
          VERIFY_STATUS: ${{ job.status }}
          VERIFY_PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          receipt = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'status': os.environ['VERIFY_STATUS'], 'platform': os.environ['VERIFY_PLATFORM'],
                     'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          if receipt['status'] != 'success':
              try:
                  endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs"
                  jobs = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))['jobs']
                  failed = [j for j in jobs if j['conclusion'] == 'failure' and os.environ['VERIFY_PLATFORM'] in j['name']]
                  receipt['failed_steps'] = [{'job': j['name'], 'steps': [s['name'] for s in j['steps'] if s['conclusion'] == 'failure']} for j in failed]
                  receipt['failure_log'] = '\n'.join(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/jobs/{j['id']}/logs"], text=True)[-24000:] for j in failed)
              except (subprocess.CalledProcessError, KeyError) as error:
                  receipt['log_unavailable'] = str(error)
          with open('desktop-verification.json', 'w') as output:
              json.dump(receipt, output, indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          note="refs/notes/qa-${VERIFY_PLATFORM}"
          if git ls-remote --exit-code origin "$note"; then
            git fetch origin "$note:$note"
          fi
          git notes --ref="qa-${VERIFY_PLATFORM}" add -f -F desktop-verification.json HEAD
          git push origin "$note"
